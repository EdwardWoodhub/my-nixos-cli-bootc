name: Build NixOS Bootc VM

on:
  schedule:
    - cron: '01 18 * * *'

  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - '.github/workflows/smoke-test.yml'

  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  NIX_CHANNEL: nixos-26.05
  IMAGE_NAME: my-nixos-cli-bootc-vm

jobs:
  build-and-sync:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. 安装 Nix 工具链并显式绑定 nixpkgs 路径
      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:${{ env.NIX_CHANNEL }}
          extra_nix_config: |
            experimental-features = nix-command flakes

      # 2. 构建多层 bootc FHS 系统镜像 tar 包（内置 bootc container lint 检查）
      - name: Build Layered Bootc Image
        run: |
          nix-build image.nix -o result

      # 3. 安装 Skopeo（用于直接流式推送镜像，彻底省去耗时的 docker load 解压）
      - name: Install Skopeo
        run: |
          sudo apt-get update && sudo apt-get install -y skopeo

      # 4. 直接从 tar 归档流式推送到 GHCR
      - name: Push to GHCR
        run: |
          REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          GHCR_IMAGE="docker://ghcr.io/${REPO_OWNER}/${{ env.IMAGE_NAME }}:latest"

          echo ">>> 正在流式推送到 GHCR: $GHCR_IMAGE"
          skopeo copy \
            --dest-creds="${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}" \
            "docker-archive:result" "$GHCR_IMAGE"

      # 5. 使用 Skopeo 同步镜像到阿里云 ACR
      - name: Sync Image to Aliyun ACR using Skopeo
        run: |
          REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          SRC_IMAGE="docker://ghcr.io/${REPO_OWNER}/${{ env.IMAGE_NAME }}:latest"
          DEST_IMAGE="docker://${{ secrets.ALIYUN_ACR_REGISTRY }}/edwardwoodhub/${{ env.IMAGE_NAME }}:latest"

          echo ">>> 正在使用 Skopeo 同步镜像到阿里云 ACR..."
          skopeo copy \
            --src-creds="${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}" \
            --dest-creds="${{ secrets.ALIYUN_ACR_USERNAME }}:${{ secrets.ALIYUN_ACR_PASSWORD }}" \
            "$SRC_IMAGE" "$DEST_IMAGE"

          echo ">>> 同步完成！"

      # 6. 生成发布所用的 Tag 与时间戳
      - name: Generate Release Tag
        id: vars
        run: |
          TAG_NAME="liveiso-$(date +'%Y%m%d%H%M')"
          echo "tag=${TAG_NAME}" >> $GITHUB_OUTPUT

      # 7. 构建 NixOS LiveCD ISO（已预装 bootc 和 podman）
      - name: Build NixOS LiveCD ISO
        run: |
          nix-build '<nixpkgs/nixos>' \
            -A config.system.build.isoImage \
            -I nixos-config=./iso.nix \
            -o iso-result

          cp iso-result/iso/*.iso ${{ env.IMAGE_NAME }}.iso

      # 8. 将大于 2GB 的 ISO 切割为多个 1.5GB 的文件
      - name: Split ISO
        run: |
          split -b 1500M ${{ env.IMAGE_NAME }}.iso ${{ env.IMAGE_NAME }}.iso.part-

      # 9. 发布切割后的 ISO 分卷到 GitHub Releases
      - name: Publish ISO to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: |
          github.event_name == 'push' ||
          github.event_name == 'schedule' ||
          github.event_name == 'workflow_dispatch'
        with:
          files: ${{ env.IMAGE_NAME }}.iso.part-*
          tag_name: ${{ steps.vars.outputs.tag }}
          name: "LiveISO Build ${{ steps.vars.outputs.tag }}"
          generate_release_notes: true
