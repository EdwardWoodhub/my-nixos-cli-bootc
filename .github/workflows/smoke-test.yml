name: Smoke Test Full E2E (LiveCD + Installed Bootc System)

on:
  workflow_run:
    workflows: ["Build NixOS Bootc VM"]
    types:
      - completed

  workflow_dispatch:
    inputs:
      release_tag:
        description: "指定要测试的 Release Tag（留空则自动拉取最新 Release）"
        required: false
        default: ""

permissions:
  contents: read

env:
  IMAGE_NAME: my-nixos-cli-bootc-vm
  OCI_IMAGE: docker://ghcr.io/edwardwoodhub/my-nixos-cli-bootc-vm:latest

jobs:
  smoke-test-e2e:
    runs-on: ubuntu-24.04
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')

    steps:
      - name: Install QEMU, OVMF, and ISO Inspection Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils ovmf xorriso gh

      - name: Download Latest Release ISO Parts and Reassemble
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            LATEST_TAG="$INPUT_TAG"
          else
            echo ">>> 获取最新 Release 信息..."
            LATEST_TAG=$(gh release list --repo "${{ github.repository }}" --limit 1 --json tagName -q '.[0].tagName')
          fi

          if [ -z "$LATEST_TAG" ]; then
            echo "[ERROR] 未找到可用的 Release Tag！" >&2
            exit 1
          fi

          echo ">>> 正在下载 Release: $LATEST_TAG"
          gh release download "$LATEST_TAG" \
            --repo "${{ github.repository }}" \
            --pattern "${{ env.IMAGE_NAME }}.iso.part-*"

          echo ">>> 合并分卷恢复完整 ISO..."
          cat ${{ env.IMAGE_NAME }}.iso.part-* > ${{ env.IMAGE_NAME }}.iso
          rm -f ${{ env.IMAGE_NAME }}.iso.part-*
          ls -lh ${{ env.IMAGE_NAME }}.iso

      - name: Static ISO Structure & Boot Record Check
        run: |
          echo ">>> 检查 ISO 9660 卷标与 El Torito / EFI 引导记录..."
          xorriso -indev ${{ env.IMAGE_NAME }}.iso -toc 2>&1 | tee iso-toc.log
          grep -q "NIXOS_BOOTC" iso-toc.log
          echo ">>> ISO 静态结构校验通过！"

      - name: Full E2E Smoke Test (LiveCD Boot -> OSTree Deploy -> Cold Disk Reboot)
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
          fi
          cp /usr/share/OVMF/OVMF_VARS_4M.fd ./OVMF_VARS.fd
          qemu-img create -f qcow2 ./target-disk.qcow2 40G

          python3 - << 'PY_EOF'
          import subprocess, time, sys, os, select, base64

          KVM_ARGS = ["-enable-kvm", "-cpu", "host"] if os.access("/dev/kvm", os.R_OK | os.W_OK) else ["-cpu", "max"]
          OCI_IMAGE = os.environ["OCI_IMAGE"]

          deploy_script = r"""#!/usr/bin/env bash
          set -euxo pipefail
          trap 'printf "\n%s_%s\n" "DEPLOY" "FAILED"' ERR

          parted -s /dev/vda mklabel gpt
          parted -s /dev/vda mkpart EFI fat32 1MiB 513MiB
          parted -s /dev/vda set 1 esp on
          parted -s /dev/vda mkpart primary ext4 513MiB 100%

          partprobe /dev/vda || true
          udevadm settle || sleep 2

          mkfs.fat -F32 /dev/vda1
          mkfs.ext4 -F -q -L root /dev/vda2

          mount -t ext4 /dev/vda2 /mnt
          mkdir -p /mnt/boot/efi /var/work
          mount -t vfat /dev/vda1 /mnt/boot/efi
          mount -t ext4 /dev/vda2 /var/work
          mkdir -p /var/work/oci-tmp /var/work/rootfs-tmp

          ostree admin init-fs --modern /mnt
          ostree admin os-init nixos --sysroot=/mnt 2>/dev/null || true

          skopeo copy "$OCI_IMAGE" oci:/var/work/oci-tmp

          MANIFEST_DIGEST=$(jq -r '.manifests[0].digest | sub("sha256:"; "")' /var/work/oci-tmp/index.json)
          for layer in $(jq -r '.layers[].digest | sub("sha256:"; "")' "/var/work/oci-tmp/blobs/sha256/${MANIFEST_DIGEST}"); do
            tar -xf "/var/work/oci-tmp/blobs/sha256/${layer}" -C /var/work/rootfs-tmp
            rm -f "/var/work/oci-tmp/blobs/sha256/${layer}"
          done
          rm -rf /var/work/oci-tmp

          ostree commit --repo=/mnt/ostree/repo --branch=nixos --subject="CI E2E Smoke Test" /var/work/rootfs-tmp
          rm -rf /var/work/rootfs-tmp
          umount /var/work

          ROOT_UUID=$(blkid -s UUID -o value /dev/vda2)
          BOOT_UUID=$(blkid -s UUID -o value /dev/vda1)

          ostree admin deploy \
            --sysroot=/mnt \
            --os=nixos \
            --karg="root=UUID=${ROOT_UUID}" \
            --karg="rw" \
            --karg="init=/usr/nixos-toplevel/init" \
            --karg="console=tty0" \
            --karg="console=ttyS0,115200" \
            --karg="systemd.gpt_auto=0" \
            nixos

          mount -o remount,rw /mnt
          DEPLOY_DIR=$(ls -d /mnt/ostree/deploy/nixos/deploy/*.0 | head -n 1)
          chattr -R -i "${DEPLOY_DIR}" 2>/dev/null || true

          rm -f "${DEPLOY_DIR}/etc/fstab"
          cat << FSTAB_EOF > "${DEPLOY_DIR}/etc/fstab"
          UUID=${ROOT_UUID} / ext4 defaults 0 1
          UUID=${ROOT_UUID} /sysroot ext4 defaults 0 0
          UUID=${BOOT_UUID} /boot/efi vfat umask=0077 0 2
          FSTAB_EOF
          chmod 0644 "${DEPLOY_DIR}/etc/fstab"

          ROOT_HASH=$(mkpasswd -m sha-512 root)
          NACK_HASH=$(mkpasswd -m sha-512 nack)

          rm -f "${DEPLOY_DIR}/etc/passwd"
          cat << 'PASSWD_EOF' > "${DEPLOY_DIR}/etc/passwd"
          root:x:0:0:System administrator:/root:/run/current-system/sw/bin/bash
          sshd:x:498:498:SSH privilege separation user:/var/empty:/run/current-system/sw/bin/nologin
          systemd-timesync:x:499:499:systemd Time Synchronization:/var/empty:/run/current-system/sw/bin/nologin
          nobody:x:65534:65534:Unprivileged account:/var/empty:/run/current-system/sw/bin/nologin
          nack:x:1000:100:Nack:/home/nack:/run/current-system/sw/bin/bash
          PASSWD_EOF

          rm -f "${DEPLOY_DIR}/etc/group"
          cat << 'GROUP_EOF' > "${DEPLOY_DIR}/etc/group"
          root:x:0:
          wheel:x:1:nack
          users:x:100:nack
          sshd:x:498:
          systemd-timesync:x:499:
          nogroup:x:65534:
          GROUP_EOF

          rm -f "${DEPLOY_DIR}/etc/shadow"
          cat << SHADOW_EOF > "${DEPLOY_DIR}/etc/shadow"
          root:${ROOT_HASH}:19000:0:99999:7:::
          sshd:!:19000:0:99999:7:::
          systemd-timesync:!:19000:0:99999:7:::
          nobody:!:19000:0:99999:7:::
          nack:${NACK_HASH}:19000:0:99999:7:::
          SHADOW_EOF
          chown 0:0 "${DEPLOY_DIR}/etc/passwd" "${DEPLOY_DIR}/etc/group" "${DEPLOY_DIR}/etc/shadow"
          chmod 0644 "${DEPLOY_DIR}/etc/passwd" "${DEPLOY_DIR}/etc/group"
          chmod 0640 "${DEPLOY_DIR}/etc/shadow"

          chattr +i "${DEPLOY_DIR}" 2>/dev/null || true

          mkdir -p /mnt/boot/efi/loader/entries
          cp -r /mnt/boot/ostree /mnt/boot/efi/
          cp -r /mnt/boot/loader/entries/* /mnt/boot/efi/loader/entries/
          bootctl --esp-path=/mnt/boot/efi install

          sync
          umount -R /mnt
          printf "\n%s_%s\n" "DEPLOY_SUCCESS" "REBOOTING"
          poweroff
          """
          b64_script = base64.b64encode(deploy_script.encode("utf-8")).decode("ascii")

          def run_qemu(phase, with_cdrom):
              cmd = [
                  "qemu-system-x86_64",
                  "-m", "4096",
                  "-smp", "4",
                  *KVM_ARGS,
                  "-nographic",
                  "-serial", "mon:stdio",
                  "-drive", "if=pflash,format=raw,readonly=on,file=/usr/share/OVMF/OVMF_CODE_4M.fd",
                  "-drive", "if=pflash,format=raw,file=./OVMF_VARS.fd",
                  "-drive", "file=./target-disk.qcow2,format=qcow2,if=virtio",
                  "-nic", "user,model=virtio-net-pci",
                  "-no-reboot"
              ]
              if with_cdrom:
                  cmd.extend(["-cdrom", os.environ["IMAGE_NAME"] + ".iso", "-boot", "d"])
              else:
                  cmd.extend(["-boot", "c"])

              print(f"\n==================== [{phase}] 启动 QEMU ====================")
              proc = subprocess.Popen(
                  cmd,
                  stdin=subprocess.PIPE,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
                  bufsize=0
              )

              fd = proc.stdout.fileno()
              os.set_blocking(fd, False)

              start_time = time.time()
              timeout = 720
              sent_boot_keys = False
              sent_deploy = False
              verify_state = "wait_login"
              verify_triggered_at = None
              buffer = ""

              fatal_markers = [
                  "Kernel panic",
                  "You are in emergency mode",
                  "Failed to mount",
                  "Failed to start Bind mount",
                  "Failed to start Find NixOS closure",
                  "DEPLOY_FAILED"
              ]

              while True:
                  if time.time() - start_time > timeout:
                      print(f"\n[ERROR] [{phase}] 达到 {timeout} 秒严格超时！", file=sys.stderr)
                      proc.kill()
                      sys.exit(1)

                  if not with_cdrom and verify_triggered_at and (time.time() - verify_triggered_at > 45):
                      print("\n[ERROR] [Phase 2] 登录校验超时未完成！", file=sys.stderr)
                      proc.kill()
                      sys.exit(1)

                  rlist, _, _ = select.select([fd], [], [], 1.0)
                  if rlist:
                      try:
                          chunk = os.read(fd, 4096)
                      except BlockingIOError:
                          chunk = b""
                      if not chunk:
                          if proc.poll() is not None:
                              break
                          continue

                      text = chunk.decode("utf-8", errors="replace")
                      sys.stdout.write(text)
                      sys.stdout.flush()
                      buffer += text

                      if not sent_boot_keys and "Press 't' to use the text boot menu" in buffer:
                          print("\n>>> [AUTO-INPUT] 检测到引导菜单，自动发送按键立即引导...")
                          time.sleep(1)
                          proc.stdin.write(b"t\r")
                          proc.stdin.flush()
                          time.sleep(1)
                          proc.stdin.write(b"\r")
                          proc.stdin.flush()
                          sent_boot_keys = True

                      for err in fatal_markers:
                          if err in buffer:
                              print(f"\n[ERROR] [{phase}] 检测到致命错误: {err}", file=sys.stderr)
                              proc.kill()
                              sys.exit(1)

                      if with_cdrom:
                          if not sent_deploy and "automatic login" in buffer and ("nixos@vmNixX11" in buffer[-128:] or "$ " in buffer[-64:]):
                              print("\n>>> [AUTO-DEPLOY] LiveCD 自动登录成功，注入 Base64 部署脚本并开始落盘安装...")
                              time.sleep(1)
                              inject = f"echo '{b64_script}' | base64 -d > /tmp/deploy.sh && chmod +x /tmp/deploy.sh && sudo OCI_IMAGE='{OCI_IMAGE}' bash /tmp/deploy.sh\n"
                              proc.stdin.write(inject.encode("utf-8"))
                              proc.stdin.flush()
                              sent_deploy = True

                          if "DEPLOY_SUCCESS_REBOOTING" in buffer:
                              proc.wait(timeout=30)
                              print("\n[SUCCESS] 阶段 1 完成：LiveCD 成功将 bootc 镜像部署至虚拟磁盘并安全关机！")
                              return
                      else:
                          if verify_state == "wait_login" and "login:" in buffer[-128:]:
                              print("\n>>> [AUTO-VERIFY] 检测到 login: 提示符，发送用户名 root...")
                              verify_triggered_at = time.time()
                              time.sleep(0.5)
                              proc.stdin.write(b"root\n")
                              proc.stdin.flush()
                              verify_state = "wait_password"

                          elif verify_state == "wait_password" and "Password:" in buffer[-64:]:
                              print("\n>>> [AUTO-VERIFY] 检测到 Password: 提示符，发送密码 root...")
                              time.sleep(0.5)
                              proc.stdin.write(b"root\n")
                              proc.stdin.flush()
                              verify_state = "wait_shell"

                          elif verify_state == "wait_shell" and ("#" in buffer[-32:] or "$" in buffer[-32:]):
                              print("\n>>> [AUTO-VERIFY] 成功进入 root shell，执行运行态校验...")
                              time.sleep(0.5)
                              verify_cmd = (
                                  "ls -ld /nix/store; "
                                  "ostree admin status; "
                                  "systemctl --failed; "
                                  "printf '\\n%s_%s\\n' 'E2E_ALL' 'PASSED'\n"
                              )
                              proc.stdin.write(verify_cmd.encode("utf-8"))
                              proc.stdin.flush()
                              verify_state = "done"

                          if "E2E_ALL_PASSED" in buffer:
                              print("\n[SUCCESS] 阶段 2 完成：目标 bootc 系统已脱离 ISO 成功冷启动、登录并通过全部运行态校验！")
                              proc.terminate()
                              return

                      if len(buffer) > 32768:
                          buffer = buffer[-16384:]
                  else:
                      if proc.poll() is not None:
                          break

              print(f"\n[ERROR] [{phase}] QEMU 提前退出且未达到预期里程碑！", file=sys.stderr)
              sys.exit(1)

          run_qemu("Phase 1: LiveCD Deploy to Disk", with_cdrom=True)
          run_qemu("Phase 2: Installed System Cold Boot", with_cdrom=False)
          PY_EOF
