name: Smoke Test LiveCD ISO

on:
  workflow_run:
    workflows: ["Build NixOS Bootc VM"]
    types:
      - completed

  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: my-nixos-cli-bootc-vm

jobs:
  smoke-test-iso:
    runs-on: ubuntu-24.04
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Install QEMU and ISO Inspection Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 ovmf xorriso gh

      - name: Download Latest Release ISO Parts and Reassemble
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo ">>> 获取最新 Release 信息..."
          LATEST_TAG=$(gh release list --repo "${{ github.repository }}" --limit 1 --json tagName -q '.[0].tagName')
          echo ">>> 正在下载 Release: $LATEST_TAG"
          gh release download "$LATEST_TAG" \
            --repo "${{ github.repository }}" \
            --pattern "${{ env.IMAGE_NAME }}.iso.part-*"

          echo ">>> 合并分卷恢复完整 ISO..."
          cat ${{ env.IMAGE_NAME }}.iso.part-* > ${{ env.IMAGE_NAME }}.iso
          rm -f ${{ env.IMAGE_NAME }}.iso.part-*
          ls -lh ${{ env.IMAGE_NAME }}.iso

      - name: Static ISO Structure & Boot Record Check
        run: |
          echo ">>> 检查 ISO 9660 卷标与 El Torito / EFI 引导记录..."
          xorriso -indev ${{ env.IMAGE_NAME }}.iso -toc 2>&1 | tee iso-toc.log
          grep -q "NIXOS_BOOTC" iso-toc.log
          echo ">>> ISO 静态结构校验通过！"

      - name: Boot LiveCD in Headless QEMU (UEFI Smoke Test)
        run: |
          cp /usr/share/OVMF/OVMF_VARS_4M.fd ./OVMF_VARS.fd

          echo ">>> 启动无头 QEMU 虚拟机测试 LiveCD 引导（超时限制 10 分钟）..."
          python3 - << 'EOF'
          import subprocess, time, sys, os, select

          cmd = [
              "qemu-system-x86_64",
              "-m", "4096",
              "-smp", "4",
              "-cpu", "max",
              "-nographic",
              "-serial", "mon:stdio",
              "-drive", "if=pflash,format=raw,readonly=on,file=/usr/share/OVMF/OVMF_CODE_4M.fd",
              "-drive", "if=pflash,format=raw,file=./OVMF_VARS.fd",
              "-cdrom", os.environ["IMAGE_NAME"] + ".iso",
              "-boot", "d",
              "-no-reboot"
          ]

          proc = subprocess.Popen(
              cmd,
              stdin=subprocess.PIPE,
              stdout=subprocess.PIPE,
              stderr=subprocess.STDOUT,
              bufsize=0
          )

          fd = proc.stdout.fileno()
          os.set_blocking(fd, False)

          start_time = time.time()
          timeout = 600  # 严格 10 分钟非阻塞超时
          sent_boot_keys = False
          buffer = ""

          success_markers = [
              "login:",
              "Reached target Graphical Interface",
              "Reached target Multi-User System",
              "Welcome to NixOS"
          ]
          fatal_markers = [
              "Kernel panic",
              "You are in emergency mode",
              "Failed to mount"
          ]

          matched = False
          while True:
              elapsed = time.time() - start_time
              if elapsed > timeout:
                  print(f"\n[ERROR] QEMU 冒烟测试达到 {timeout} 秒严格超时！", file=sys.stderr)
                  proc.kill()
                  sys.exit(1)

              rlist, _, _ = select.select([fd], [], [], 1.0)
              if rlist:
                  try:
                      chunk = os.read(fd, 4096)
                  except BlockingIOError:
                      chunk = b""
                  if not chunk:
                      if proc.poll() is not None:
                          break
                      continue

                  text = chunk.decode("utf-8", errors="replace")
                  sys.stdout.write(text)
                  sys.stdout.flush()
                  buffer += text

                  # 检测到 systemd-boot 菜单提示时，自动发送 't' 和回车触发立即引导
                  if not sent_boot_keys and "Press 't' to use the text boot menu" in buffer:
                      print("\n>>> [AUTO-INPUT] 检测到引导菜单，自动发送按键启动默认内核...")
                      time.sleep(1)
                      proc.stdin.write(b"t\r")
                      proc.stdin.flush()
                      time.sleep(1)
                      proc.stdin.write(b"\r")
                      proc.stdin.flush()
                      sent_boot_keys = True

                  for err in fatal_markers:
                      if err in buffer:
                          print(f"\n[ERROR] 检测到致命启动错误: {err}", file=sys.stderr)
                          proc.kill()
                          sys.exit(1)

                  for ok in success_markers:
                      if ok in buffer:
                          print(f"\n[SUCCESS] LiveCD 成功完成 UEFI 引导并进入用户态！匹配标志: {ok}")
                          matched = True
                          proc.terminate()
                          break

                  if matched:
                      break

                  # 防止内存缓冲区无限增长，只保留最近 16KB 文本用于关键字匹配
                  if len(buffer) > 16384:
                      buffer = buffer[-8192:]
              else:
                  if proc.poll() is not None:
                      break

          if not matched:
              print("\n[ERROR] QEMU 提前退出且未检测到成功启动标志！", file=sys.stderr)
              sys.exit(1)
          EOF
